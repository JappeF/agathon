<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Picker test</title>
<style>
  body { background: #120b1c; color: #ddd3e8; font: 16px system-ui, sans-serif; margin: 0; padding: 1rem; }
  h1 { font-size: 1.2rem; color: #f3d58a; }
  label { display: block; margin: 0.6rem 0; padding: 0.9rem 1rem; border: 1px solid #a8812f; border-radius: 12px; background: #1c1229; }
  label input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  code { color: #f3d58a; }
  .got { display: block; margin-top: 0.3rem; color: #9fe0a8; font-size: 0.9rem; }
  p { color: #b3a3c9; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>Which picker shows the .json files?</h1>
<p>Tap each button and look for your .agathon.json files. You can pick one; nothing is uploaded, the page only shows its name and type.</p>
<div id="list"></div>
<p id="ua"></p>
<script>
  const variants = [
    ['A: no filter', null],
    ['B: */*', '*/*'],
    ['C: .json', '.json'],
    ['D: application/json', 'application/json'],
    ['E: .json + application/json + text/plain', '.json,application/json,text/plain'],
    ['F: application/octet-stream', 'application/octet-stream'],
    ['G: PDF + JSON (as before)', 'application/pdf,.pdf,application/json,.json'],
  ];
  const list = document.getElementById('list');
  for (const [name, accept] of variants) {
    const label = document.createElement('label');
    label.innerHTML = `<strong>${name}</strong> <code>${accept ?? '(no accept)'}</code><span class="got"></span>`;
    const input = document.createElement('input');
    input.type = 'file';
    if (accept) input.accept = accept;
    input.addEventListener('change', () => {
      const f = input.files[0];
      label.querySelector('.got').textContent = f ? `Picked: ${f.name} (${f.type || 'no type'}, ${f.size} bytes)` : 'Nothing picked';
    });
    label.prepend(input);
    list.append(label);
  }
  document.getElementById('ua').textContent = navigator.userAgent;
</script>
</body>
</html>
